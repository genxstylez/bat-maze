<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Bat Maze — 20 Levels</title>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0e0a1f;
    --floor:#171130;
    --wall:#2c2456;
    --wall-hi:#453a80;
    --amber:#ffb84d;
    --bat:#b18cff;
    --exit:#4dffc3;
    --venom:#8aff4d;
    --text:#e8e2ff;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"Pixelify Sans",ui-monospace,monospace;
    display:flex;flex-direction:column;align-items:center;
    overflow:hidden;touch-action:none;
    user-select:none;-webkit-user-select:none;
  }
  #hud{
    width:100%;max-width:560px;
    display:flex;justify-content:space-between;align-items:baseline;
    padding:14px 18px 8px;
  }
  #hud .title{font-size:20px;font-weight:700;letter-spacing:1px;color:var(--amber);}
  #hud .lvl{font-size:18px;color:var(--exit);}
  #mute{
    font-size:16px;background:#221a45;border:2px solid #3a2f6e;border-radius:8px;
    color:var(--text);padding:2px 8px;cursor:pointer;line-height:1.3;
  }
  #mute:active{background:#3a2f6e;}
  #wrap{position:relative;flex:1;width:100%;display:flex;align-items:center;justify-content:center;padding:4px 10px;}
  canvas{
    image-rendering:pixelated;
    border-radius:10px;
    box-shadow:0 0 0 3px #221a45, 0 0 40px rgba(77,255,195,.06);
    max-width:100%;max-height:100%;
  }
  #overlay{
    position:absolute;inset:0;display:none;
    align-items:center;justify-content:center;flex-direction:column;gap:14px;
    background:rgba(14,10,31,.82);backdrop-filter:blur(3px);
    text-align:center;padding:20px;
  }
  #overlay.show{display:flex;}
  #overlay h2{font-size:30px;font-weight:700;}
  #overlay p{font-size:16px;line-height:1.5;max-width:420px;color:#c9c0f2;}
  #overlay button{
    font-family:inherit;font-size:18px;font-weight:600;
    background:var(--amber);color:#2a1a00;border:none;border-radius:8px;
    padding:12px 28px;cursor:pointer;
    box-shadow:0 4px 0 #a86f1d;
  }
  #overlay button:active{transform:translateY(3px);box-shadow:0 1px 0 #a86f1d;}
  #pad{
    position:fixed;
    right:max(14px, env(safe-area-inset-right));
    top:55%;
    transform:translateY(-50%);
    display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,52px);
    gap:6px;
    z-index:10;
    opacity:0.92;
  }
  #pad button{
    font-family:inherit;font-size:22px;color:var(--text);
    background:rgba(34,26,69,0.85);border:2px solid #3a2f6e;border-radius:10px;
    cursor:pointer;
    backdrop-filter:blur(2px);
  }
  #pad button:active{background:#3a2f6e;}
  #pad .up{grid-column:2;grid-row:1;}
  #pad .left{grid-column:1;grid-row:2;}
  #pad .down{grid-column:2;grid-row:2;}
  #pad .right{grid-column:3;grid-row:2;}
  /* controls adapt to how you play: keyboard mode hides the d-pad, touch mode shows it */
  body.kbd #pad{display:none;}
  body.touch #hint{display:none;}
  #hint{font-size:13px;color:#7f74b3;padding-bottom:10px;}
</style>
</head>
<body>
<div id="hud">
  <span class="title">BAT MAZE</span>
  <span style="display:flex;gap:14px;align-items:baseline;">
    <span class="lvl">Level <span id="lvlNum">1</span> / 20</span>
    <button id="mute" title="Sound on/off">🔊</button>
  </span>
</div>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="overlay">
    <h2 id="ovTitle">Bat Maze</h2>
    <p id="ovText">20 levels. Reach the glowing portal. Bats fly through walls, put on random bursts of speed, and from level 8 they spit venom. Grab ⚡ to move faster and ★ to become invincible for a few seconds.</p>
    <button id="ovBtn">Start</button>
  </div>
</div>
<div id="hint">Arrow keys / WASD to move</div>
<div id="pad">
  <button class="up" data-d="0,-1">▲</button>
  <button class="left" data-d="-1,0">◀</button>
  <button class="down" data-d="0,1">▼</button>
  <button class="right" data-d="1,0">▶</button>
</div>

<script>
(() => {
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const ovTitle = document.getElementById('ovTitle');
const ovText = document.getElementById('ovText');
const ovBtn = document.getElementById('ovBtn');
const lvlNum = document.getElementById('lvlNum');

// ---------- sound (Web Audio, no files needed) ----------
const Sound = (() => {
  let ac=null, master=null, musicGain=null, muted=false;
  let seqTimer=null, step=0, nextTime=0, bpm=116;
  function ctx(){
    if(!ac){
      ac = new (window.AudioContext||window.webkitAudioContext)();
      master = ac.createGain(); master.gain.value = 0.5; master.connect(ac.destination);
      musicGain = ac.createGain(); musicGain.gain.value = 0.20; musicGain.connect(master);
    }
    if(ac.state==='suspended') ac.resume();
    return ac;
  }
  function tone(freq, t0, dur, type, vol, dest){
    const a=ctx();
    const o=a.createOscillator(), g=a.createGain();
    o.type=type; o.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    o.connect(g); g.connect(dest||master);
    o.start(t0); o.stop(t0+dur+0.05);
  }
  // spooky A-minor loop: lead arpeggio + bass, 8 eighth-note steps
  const LEAD = [440, 523.25, 659.25, 523.25, 440, 493.88, 587.33, 493.88];
  const BASS = [110, 0, 130.81, 0, 110, 0, 164.81, 82.41];
  function scheduler(){
    const a=ctx();
    const spb = 60/bpm/2;
    while(nextTime < a.currentTime + 0.25){
      const i = step % 8;
      if(LEAD[i]) tone(LEAD[i], nextTime, spb*0.9, 'triangle', 0.5, musicGain);
      if(BASS[i]) tone(BASS[i], nextTime, spb*1.8, 'square', 0.3, musicGain);
      step++; nextTime += spb;
    }
  }
  return {
    startMusic(lv){
      ctx();
      bpm = 108 + lv*4; // music speeds up each level
      if(!seqTimer){
        nextTime = ac.currentTime + 0.05; step = 0;
        seqTimer = setInterval(scheduler, 100);
      }
    },
    stopMusic(){ clearInterval(seqTimer); seqTimer=null; },
    stepBlip(){ const a=ctx(); tone(240, a.currentTime, 0.05, 'square', 0.10); },
    pickup(){ const a=ctx(), t=a.currentTime; tone(660,t,0.08,'square',0.30); tone(990,t+0.08,0.12,'square',0.30); },
    spit(){ const a=ctx(), t=a.currentTime; tone(480,t,0.12,'sawtooth',0.18); tone(240,t+0.05,0.12,'sawtooth',0.15); },
    caught(){
      this.stopMusic();
      const a=ctx(), t=a.currentTime;
      tone(300, t,      0.30, 'sawtooth', 0.40);
      tone(220, t+0.12, 0.30, 'sawtooth', 0.40);
      tone(140, t+0.26, 0.55, 'sawtooth', 0.45);
    },
    clear(){
      this.stopMusic();
      const a=ctx(), t=a.currentTime;
      [523.25, 659.25, 783.99, 1046.5].forEach((f,i)=>tone(f, t+i*0.09, 0.18, 'triangle', 0.40));
    },
    win(){
      this.stopMusic();
      const a=ctx(), t=a.currentTime;
      [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5, 1318.5].forEach((f,i)=>tone(f, t+i*0.14, 0.30, 'triangle', 0.45));
    },
    toggleMute(){ ctx(); muted=!muted; master.gain.value = muted?0:0.5; return muted; }
  };
})();
const muteBtn = document.getElementById('mute');
muteBtn.onclick = () => { muteBtn.textContent = Sound.toggleMute() ? '🔇' : '🔊'; };

// ---------- tuning ----------
const TOTAL_LEVELS = 20;
const SIZES      = [9,9,11,11,13,13,15,15,17,17, 19,19,21,21,21,23,23,23,25,25];
const BAT_SPEED  = [1.6,1.9,2.1,2.3,2.5,2.7,2.9,3.1,3.3,3.4, 3.5,3.6,3.7,3.8,3.9,4.0,4.1,4.2,4.3,4.4];
const BAT_HOMING = [0.005,0.007,0.009,0.011,0.013,0.015,0.018,0.021,0.024,0.026, 0.028,0.030,0.032,0.034,0.036,0.038,0.040,0.043,0.046,0.050];
const SPIT_FROM = 8;          // bats spit venom from this level up
const GRACE_MS = 1800;
const MOVE_COOLDOWN = 105;    // ms between steps
const FAST_COOLDOWN = 55;     // with speed boost
const SPEED_MS = 6000;        // speed boost duration
const INV_MS = 5000;          // invincibility duration

let level = 1;
let maze, cols, rows, cell;
let player, exit, bats, items, spits;
let state = 'menu'; // menu | play | caught | between | win
let graceUntil = 0;
let lastT = 0;
let shake = 0;
let lastMoveT = 0;
let speedUntil = 0, invUntil = 0;

// ---------- maze generation (recursive backtracker) ----------
function genMaze(n){
  cols = rows = n;
  const g = Array.from({length:n}, () => Array(n).fill(1));
  const stack = [[1,1]];
  g[1][1] = 0;
  const dirs = [[2,0],[-2,0],[0,2],[0,-2]];
  while(stack.length){
    const [x,y] = stack[stack.length-1];
    const opts = dirs
      .map(([dx,dy]) => [x+dx, y+dy, x+dx/2, y+dy/2])
      .filter(([nx,ny]) => nx>0 && ny>0 && nx<n-1 && ny<n-1 && g[ny][nx]===1);
    if(!opts.length){ stack.pop(); continue; }
    const [nx,ny,wx,wy] = opts[Math.floor(Math.random()*opts.length)];
    g[wy][wx] = 0; g[ny][nx] = 0;
    stack.push([nx,ny]);
  }
  // extra openings so there are loops (escape routes)
  const extra = Math.floor(n/4);
  for(let i=0;i<extra;i++){
    const x = 1+Math.floor(Math.random()*(n-2));
    const y = 1+Math.floor(Math.random()*(n-2));
    if(g[y][x]===1){
      const open = (g[y-1]?.[x]===0) + (g[y+1]?.[x]===0) + (g[y][x-1]===0) + (g[y][x+1]===0);
      if(open>=2) g[y][x]=0;
    }
  }
  return g;
}

// ---------- level setup ----------
function startLevel(lv){
  level = lv;
  lvlNum.textContent = lv;
  const n = SIZES[lv-1];
  maze = genMaze(n);
  player = {x:1, y:1, px:1, py:1};
  exit = {x:n-2, y:n-2};
  speedUntil = 0; invUntil = 0;
  spits = [];

  // bats: 1 bat, 2 from level 3, 3 from level 6, 4 from level 9
  const nBats = lv>=9 ? 4 : lv>=6 ? 3 : lv>=3 ? 2 : 1;
  const mid = Math.floor(n/2);
  const spawns = [[n-2,1],[1,n-2],[n-2,mid],[mid,1]];
  bats = [];
  for(let i=0;i<nBats;i++){
    const [sx,sy] = spawns[i%spawns.length];
    const ang = Math.random()*Math.PI*2;
    bats.push({
      x: sx + Math.random()*0.5, y: sy + Math.random()*0.5,
      vx: Math.cos(ang), vy: Math.sin(ang),
      flap: 0, mode: 'wander', modeUntil: 0,
      burstUntil: 0, spitAt: 0
    });
  }

  // items scattered on floor cells, away from start and exit
  items = [];
  const nItems = Math.min(4, 1 + Math.floor(lv/5));
  let guard = 0;
  while(items.length < nItems && guard++ < 400){
    const x = 1+Math.floor(Math.random()*(n-2));
    const y = 1+Math.floor(Math.random()*(n-2));
    if(maze[y][x]!==0) continue;
    if(Math.hypot(x-1,y-1) < 4) continue;
    if(x===exit.x && y===exit.y) continue;
    if(items.some(it => it.x===x && it.y===y)) continue;
    items.push({x, y, type: Math.random()<0.5 ? 'speed' : 'inv'});
  }

  graceUntil = performance.now() + GRACE_MS;
  resize();
  state = 'play';
  overlay.classList.remove('show');
  Sound.startMusic(lv);
}

// ---------- rendering ----------
function resize(){
  const wrap = document.getElementById('wrap');
  const avail = Math.min(wrap.clientWidth-20, wrap.clientHeight-20, 560);
  cell = Math.max(12, Math.floor(avail / cols));
  const dpr = window.devicePixelRatio || 1;
  canvas.width = cols*cell*dpr;
  canvas.height = rows*cell*dpr;
  canvas.style.width = cols*cell+'px';
  canvas.style.height = rows*cell+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize', () => { if(maze) resize(); });

function css(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

function drawBolt(cx, cy, s){
  ctx.beginPath();
  ctx.moveTo(cx+s*0.15, cy-s*0.5);
  ctx.lineTo(cx-s*0.25, cy+s*0.1);
  ctx.lineTo(cx+s*0.02, cy+s*0.1);
  ctx.lineTo(cx-s*0.15, cy+s*0.5);
  ctx.lineTo(cx+s*0.25, cy-s*0.1);
  ctx.lineTo(cx-s*0.02, cy-s*0.1);
  ctx.closePath();
  ctx.fill();
}
function drawStar(cx, cy, s){
  ctx.beginPath();
  for(let i=0;i<10;i++){
    const r = i%2===0 ? s*0.5 : s*0.22;
    const a = -Math.PI/2 + i*Math.PI/5;
    const x = cx + Math.cos(a)*r, y = cy + Math.sin(a)*r;
    i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
  }
  ctx.closePath();
  ctx.fill();
}

function draw(t){
  ctx.save();
  if(shake>0){
    ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
    shake *= 0.85; if(shake<0.5) shake=0;
  }
  // floor + walls
  ctx.fillStyle = css('--floor');
  ctx.fillRect(0,0,cols*cell,rows*cell);
  for(let y=0;y<rows;y++){
    for(let x=0;x<cols;x++){
      if(maze[y][x]===1){
        ctx.fillStyle = css('--wall');
        ctx.fillRect(x*cell, y*cell, cell, cell);
        ctx.fillStyle = css('--wall-hi');
        ctx.fillRect(x*cell, y*cell, cell, Math.max(2,cell*0.14));
      }
    }
  }
  // exit portal — pulsing ring
  const ex = (exit.x+0.5)*cell, ey = (exit.y+0.5)*cell;
  const pulse = 0.75 + 0.25*Math.sin(t/300);
  const grad = ctx.createRadialGradient(ex,ey,1, ex,ey,cell*0.9);
  grad.addColorStop(0,'rgba(77,255,195,0.55)');
  grad.addColorStop(1,'rgba(77,255,195,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(ex-cell, ey-cell, cell*2, cell*2);
  ctx.strokeStyle = css('--exit');
  ctx.lineWidth = Math.max(2, cell*0.09);
  ctx.beginPath();
  ctx.arc(ex, ey, cell*0.32*pulse, 0, Math.PI*2);
  ctx.stroke();

  // items — bobbing pickups
  for(const it of items){
    const ix = (it.x+0.5)*cell;
    const iy = (it.y+0.5)*cell + Math.sin(t/250 + it.x)*cell*0.06;
    if(it.type==='speed'){
      ctx.fillStyle = css('--amber');
      drawBolt(ix, iy, cell*0.62);
    }else{
      ctx.fillStyle = css('--exit');
      drawStar(ix, iy, cell*0.72);
    }
  }

  // venom spits
  ctx.fillStyle = css('--venom');
  for(const s of spits){
    const sx=(s.x+0.5)*cell, sy=(s.y+0.5)*cell;
    ctx.beginPath();
    ctx.arc(sx, sy, Math.max(2.5, cell*0.12), 0, Math.PI*2);
    ctx.fill();
  }

  // player — amber square with glow (teal when invincible)
  const px = (player.px+0.5)*cell, py = (player.py+0.5)*cell;
  const inv = t < invUntil;
  const fast = t < speedUntil;
  const glowCol = inv ? '77,255,195' : '255,184,77';
  const pg = ctx.createRadialGradient(px,py,1, px,py,cell*1.1);
  pg.addColorStop(0,'rgba('+glowCol+',0.35)');
  pg.addColorStop(1,'rgba('+glowCol+',0)');
  ctx.fillStyle = pg;
  ctx.fillRect(px-cell*1.1, py-cell*1.1, cell*2.2, cell*2.2);
  const s = cell*0.56;
  // invincible shield ring (flashes in the last second)
  if(inv && (invUntil-t > 1000 || Math.floor(t/120)%2===0)){
    ctx.strokeStyle = css('--exit');
    ctx.lineWidth = Math.max(2, cell*0.07);
    ctx.beginPath();
    ctx.arc(px, py, s*0.85, 0, Math.PI*2);
    ctx.stroke();
  }
  // speed ring
  if(fast && (speedUntil-t > 1000 || Math.floor(t/120)%2===0)){
    ctx.strokeStyle = css('--amber');
    ctx.lineWidth = Math.max(1.5, cell*0.05);
    ctx.beginPath();
    ctx.arc(px, py, s*1.05, 0, Math.PI*2);
    ctx.stroke();
  }
  ctx.fillStyle = css('--amber');
  ctx.fillRect(px-s/2, py-s/2, s, s);
  ctx.fillStyle = '#3a2405';
  const eyeS = Math.max(2, s*0.16);
  ctx.fillRect(px-s*0.22, py-s*0.18, eyeS, eyeS);
  ctx.fillRect(px+s*0.06, py-s*0.18, eyeS, eyeS);

  // bats — flapping wings, flash during grace
  const inGrace = t < graceUntil;
  const flap = Math.sin(t/90);
  for(const bat of bats){
  const bx = (bat.x+0.5)*cell, by = (bat.y+0.5)*cell;
  if(!inGrace || Math.floor(t/150)%2===0){
    // shadow on floor
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath();
    ctx.ellipse(bx, by+cell*0.35, cell*0.28, cell*0.10, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = css('--bat');
    // body
    ctx.beginPath();
    ctx.ellipse(bx, by, cell*0.16, cell*0.20, 0, 0, Math.PI*2);
    ctx.fill();
    // wings
    const wy = flap * cell*0.18;
    ctx.beginPath();
    ctx.moveTo(bx-cell*0.10, by);
    ctx.quadraticCurveTo(bx-cell*0.45, by-cell*0.30+wy, bx-cell*0.52, by+wy*0.5);
    ctx.quadraticCurveTo(bx-cell*0.30, by+cell*0.10, bx-cell*0.10, by+cell*0.06);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(bx+cell*0.10, by);
    ctx.quadraticCurveTo(bx+cell*0.45, by-cell*0.30+wy, bx+cell*0.52, by+wy*0.5);
    ctx.quadraticCurveTo(bx+cell*0.30, by+cell*0.10, bx+cell*0.10, by+cell*0.06);
    ctx.fill();
    // eyes — brighter red while bursting
    ctx.fillStyle = t < bat.burstUntil ? '#ff2222' : '#ff5d5d';
    const be = Math.max(1.5, cell*0.05);
    ctx.fillRect(bx-cell*0.09, by-cell*0.08, be, be);
    ctx.fillRect(bx+cell*0.04, by-cell*0.08, be, be);
  }
  }
  ctx.restore();
}

// ---------- lose helper ----------
function lose(msg){
  if(state!=='play') return;
  state='caught';
  shake = 14;
  Sound.caught();
  setTimeout(() => showOverlay(
    'Caught!',
    msg+' Try level '+level+' again.',
    'Retry level '+level,
    () => startLevel(level)
  ), 350);
}

// ---------- game logic ----------
function moveCooldown(){ return performance.now() < speedUntil ? FAST_COOLDOWN : MOVE_COOLDOWN; }

function tryMove(dx,dy){
  if(state!=='play') return;
  const now = performance.now();
  if(now - lastMoveT < moveCooldown()) return;
  const nx = player.x+dx, ny = player.y+dy;
  if(nx<0||ny<0||nx>=cols||ny>=rows) return;
  if(maze[ny][nx]===1) return;
  player.x=nx; player.y=ny;
  lastMoveT = now;
  Sound.stepBlip();
  // pickups
  for(let i=items.length-1;i>=0;i--){
    if(items[i].x===nx && items[i].y===ny){
      if(items[i].type==='speed') speedUntil = now + SPEED_MS;
      else invUntil = now + INV_MS;
      items.splice(i,1);
      Sound.pickup();
    }
  }
}

function update(t, dt){
  if(state!=='play') return;
  // smooth player slide
  player.px += (player.x-player.px)*Math.min(1, dt*18);
  player.py += (player.y-player.py)*Math.min(1, dt*18);

  const spd = BAT_SPEED[level-1];
  const moving = t >= graceUntil;
  const invincible = t < invUntil;

  for(const bat of bats){
    // bat mood: mostly wanders off on its own, only sometimes hunts
    if(t > (bat.modeUntil || 0)){
      bat.mode = Math.random() < 0.6 ? 'wander' : 'hunt';
      bat.modeUntil = t + 1500 + Math.random()*3000;
      if(bat.mode === 'wander'){
        const a = Math.random()*Math.PI*2;
        bat.vx = Math.cos(a); bat.vy = Math.sin(a);
      }
      // sometimes put on a random burst of speed
      if(Math.random() < 0.3) bat.burstUntil = t + 700 + Math.random()*900;
    }
    // random wander + homing, flies over walls, bounces off outer edge
    // while wandering it drifts slightly AWAY from the player
    const home = bat.mode === 'hunt' ? BAT_HOMING[level-1] : -BAT_HOMING[level-1]*0.4;
    const toX = player.px - bat.x, toY = player.py - bat.y;
    const d = Math.hypot(toX,toY) || 1;
    bat.vx += (Math.random()-0.5)*0.25 + (toX/d)*home*60*dt*10;
    bat.vy += (Math.random()-0.5)*0.25 + (toY/d)*home*60*dt*10;
    const v = Math.hypot(bat.vx,bat.vy) || 1;
    bat.vx/=v; bat.vy/=v;
    const batSpd = spd * (t < bat.burstUntil ? 1.8 : 1);
    if(moving){
      bat.x += bat.vx*batSpd*dt;
      bat.y += bat.vy*batSpd*dt;
    }
    if(bat.x < 0.6){ bat.x=0.6; bat.vx = Math.abs(bat.vx); }
    if(bat.y < 0.6){ bat.y=0.6; bat.vy = Math.abs(bat.vy); }
    if(bat.x > cols-1.6){ bat.x=cols-1.6; bat.vx = -Math.abs(bat.vx); }
    if(bat.y > rows-1.6){ bat.y=rows-1.6; bat.vy = -Math.abs(bat.vy); }

    // venom spit at higher levels
    if(level >= SPIT_FROM && moving && t > (bat.spitAt || 0)){
      bat.spitAt = t + Math.max(1200, 3200 - level*80) + Math.random()*2500;
      if(d < 8){
        const sv = 3.2 + level*0.08;
        spits.push({x:bat.x, y:bat.y, vx:(toX/d)*sv, vy:(toY/d)*sv});
        Sound.spit();
      }
    }

    // caught by a bat?
    if(moving && !invincible && state==='play' && Math.hypot(bat.x-player.px, bat.y-player.py) < 0.42){
      lose('A bat got you on level '+level+'.');
    }
  }

  // venom spits: fly straight, die on walls, kill on touch
  for(let i=spits.length-1;i>=0;i--){
    const sp = spits[i];
    sp.x += sp.vx*dt; sp.y += sp.vy*dt;
    const gx = Math.round(sp.x), gy = Math.round(sp.y);
    if(gx<0||gy<0||gx>=cols||gy>=rows || maze[gy][gx]===1){ spits.splice(i,1); continue; }
    if(!invincible && state==='play' && Math.hypot(sp.x-player.px, sp.y-player.py) < 0.35){
      spits.splice(i,1);
      lose('Bat venom hit you on level '+level+'.');
    }
  }

  // effects expire silently; exit check
  if(state==='play' && player.x===exit.x && player.y===exit.y){
    if(level===TOTAL_LEVELS){
      state='win';
      Sound.win();
      showOverlay('You escaped!','All 20 levels cleared. The bats go hungry tonight.','Play again', () => startLevel(1));
    }else{
      state='between';
      Sound.clear();
      showOverlay('Level '+level+' clear!','The maze grows and the bats get faster.','Level '+(level+1), () => startLevel(level+1));
    }
  }
}

function showOverlay(title, text, btn, action){
  ovTitle.textContent = title;
  ovText.textContent = text;
  ovBtn.textContent = btn;
  ovBtn.onclick = action;
  overlay.classList.add('show');
}

// ---------- input mode: keyboard or touchscreen ----------
function setInputMode(mode){
  document.body.classList.toggle('touch', mode==='touch');
  document.body.classList.toggle('kbd', mode==='kbd');
  if(maze) resize();
}
setInputMode(('ontouchstart' in window) || navigator.maxTouchPoints > 0 ? 'touch' : 'kbd');
window.addEventListener('keydown', e => {
  if(['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d'].includes(e.key.toLowerCase())) setInputMode('kbd');
});
window.addEventListener('pointerdown', e => {
  if(e.pointerType === 'touch') setInputMode('touch');
});

window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if(k==='arrowup'||k==='w'){ e.preventDefault(); tryMove(0,-1); }
  else if(k==='arrowdown'||k==='s'){ e.preventDefault(); tryMove(0,1); }
  else if(k==='arrowleft'||k==='a'){ e.preventDefault(); tryMove(-1,0); }
  else if(k==='arrowright'||k==='d'){ e.preventDefault(); tryMove(1,0); }
  else if(k==='enter' && overlay.classList.contains('show')){ ovBtn.click(); }
});

// d-pad with hold-to-repeat (cooldown in tryMove gates the actual speed)
let holdTimer=null, holdInt=null;
document.querySelectorAll('#pad button').forEach(b=>{
  const [dx,dy] = b.dataset.d.split(',').map(Number);
  const start = e => {
    e.preventDefault();
    tryMove(dx,dy);
    holdTimer = setTimeout(()=>{ holdInt = setInterval(()=>tryMove(dx,dy), 45); }, 250);
  };
  const stop = () => { clearTimeout(holdTimer); clearInterval(holdInt); };
  b.addEventListener('pointerdown', start);
  b.addEventListener('pointerup', stop);
  b.addEventListener('pointerleave', stop);
  b.addEventListener('pointercancel', stop);
});

// swipe on canvas
let touchStart=null;
canvas.addEventListener('pointerdown', e => { touchStart=[e.clientX,e.clientY]; });
canvas.addEventListener('pointerup', e => {
  if(!touchStart) return;
  const dx = e.clientX-touchStart[0], dy = e.clientY-touchStart[1];
  touchStart=null;
  if(Math.hypot(dx,dy) < 24) return;
  if(Math.abs(dx) > Math.abs(dy)) tryMove(Math.sign(dx),0);
  else tryMove(0,Math.sign(dy));
});

// ---------- loop ----------
function loop(t){
  const dt = Math.min(0.05, (t-lastT)/1000);
  lastT = t;
  if(maze){ update(t, dt); draw(t); }
  requestAnimationFrame(loop);
}

// menu
ovBtn.onclick = () => startLevel(1);
overlay.classList.add('show');
// pre-generate level 1 so the maze shows behind the menu
maze = genMaze(SIZES[0]);
cols = rows = SIZES[0];
player = {x:1,y:1,px:1,py:1};
exit = {x:cols-2,y:rows-2};
bats = [{x:cols-2,y:1,vx:1,vy:0.4,flap:0,mode:'wander',modeUntil:0,burstUntil:0,spitAt:0}];
items = [];
spits = [];
graceUntil = Infinity;
resize();
requestAnimationFrame(loop);
})();
</script>
